name: Check museum

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Use Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: node --check data-core.js && node --check temporal-sounding-core.js && node --check temporal-sounding.js && node --check faultline-core.js && node --check faultline.js && node --check app.js && node --check cosmic-signal.js && node --check cosmic-signal-core.js && node --check cosmic-signal-view.js && node --check cosmic-latency-core.js && node --check cosmic-latency.js && node --check cosmic-escapement-core.js && node --check cosmic-escapement.js && node --check planetary-heliodon-core.js && node --check planetary-heliodon.js && node --check deep-space-core.js && node --check deep-space.js && node --check service-worker.js && node --check scripts/test-data-core.mjs && node --check scripts/test-temporal-sounding.mjs && node --check scripts/test-faultline-core.mjs && node --check scripts/test-cosmic-signal.mjs && node --check scripts/test-cosmic-latency.mjs && node --check scripts/test-cosmic-escapement.mjs && node --check scripts/test-planetary-heliodon.mjs && node --check scripts/test-deep-space.mjs && node --check scripts/test-service-worker.mjs && node --check scripts/check.mjs
      - name: Test public data reduction
        run: node scripts/test-data-core.mjs
      - name: Test temporal sounding
        run: node scripts/test-temporal-sounding.mjs
      - name: Test Faultline Core semantics
        run: node scripts/test-faultline-core.mjs
      - name: Test cosmic signal reduction
        run: node scripts/test-cosmic-signal.mjs
      - name: Test cosmic latency reduction
        run: node scripts/test-cosmic-latency.mjs
      - name: Test celestial escapement reduction
        run: node scripts/test-cosmic-escapement.mjs
      - name: Test planetary heliodon geometry
        run: node scripts/test-planetary-heliodon.mjs
      - name: Test Deep Space gallery
        run: node scripts/test-deep-space.mjs
      - name: Test service worker lifecycle and boundary
        run: node scripts/test-service-worker.mjs
      - name: Check privacy and application contract
        run: node scripts/check.mjs
