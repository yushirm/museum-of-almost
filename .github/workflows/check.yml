name: Check museum

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Use Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: node --check app.js && node --check signal-vault-core.js && node --check signal-vault.js && node --check dreaming-wing.js && node --check dreaming-photos.js && node --check service-worker.js && node --check scripts/check.mjs && node --check scripts/test-signal-vault.mjs && node --check scripts/test-service-worker.mjs && node --check scripts/test-dreaming-wing.mjs
      - name: Test Listening Room behavior
        run: node scripts/test-signal-vault.mjs
      - name: Test Dreaming Wing behavior
        run: node scripts/test-dreaming-wing.mjs
      - name: Test service worker lifecycle and fallback
        run: node scripts/test-service-worker.mjs
      - name: Check privacy and application contract
        run: node scripts/check.mjs
