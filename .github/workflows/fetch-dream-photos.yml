name: Fetch Dreaming Wing photos

on:
  push:
    branches:
      - feature/dreaming-wing
    paths:
      - .github/workflows/fetch-dream-photos.yml

permissions:
  contents: write

concurrency:
  group: fetch-dream-photos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Install metadata-stripping image encoder
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y webp

      - name: Download and optimise public-domain photographs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/dreaming-wing /tmp/museum-photos
          agent='Museum of Almost static asset preparation'

          curl --fail --location --retry 3 --user-agent "$agent" \
            'https://upload.wikimedia.org/wikipedia/commons/6/64/Interior-museo.jpg' \
            --output /tmp/museum-photos/atrium.jpg
          curl --fail --location --retry 3 --user-agent "$agent" \
            'https://upload.wikimedia.org/wikipedia/commons/2/26/Clouds_image.jpg' \
            --output /tmp/museum-photos/clouds.jpg
          curl --fail --location --retry 3 --user-agent "$agent" \
            'https://upload.wikimedia.org/wikipedia/commons/d/d4/Apollo15_Moon_photo.jpg' \
            --output /tmp/museum-photos/moon.jpg

          cwebp -quiet -q 78 -resize 514 776 /tmp/museum-photos/atrium.jpg \
            -o assets/dreaming-wing/atrium.webp
          cwebp -quiet -q 76 -resize 640 1306 /tmp/museum-photos/clouds.jpg \
            -o assets/dreaming-wing/clouds.webp
          cwebp -quiet -q 78 -resize 1100 1107 /tmp/museum-photos/moon.jpg \
            -o assets/dreaming-wing/moon.webp

          test -s assets/dreaming-wing/atrium.webp
          test -s assets/dreaming-wing/clouds.webp
          test -s assets/dreaming-wing/moon.webp
          du -h assets/dreaming-wing/*.webp

      - name: Commit missing local photo assets to the feature branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for path in assets/dreaming-wing/atrium.webp assets/dreaming-wing/clouds.webp assets/dreaming-wing/moon.webp; do
            if gh api "repos/${GITHUB_REPOSITORY}/contents/${path}?ref=${GITHUB_REF_NAME}" >/dev/null 2>&1; then
              echo "Already present: ${path}"
              continue
            fi
            python - "$path" <<'PY'
          import base64
          import json
          import os
          import sys

          path = sys.argv[1]
          with open(path, 'rb') as source:
              content = base64.b64encode(source.read()).decode('ascii')
          with open('/tmp/photo-payload.json', 'w', encoding='utf-8') as payload:
              json.dump({
                  'message': 'Add local Dreaming Wing photograph',
                  'content': content,
                  'branch': os.environ['GITHUB_REF_NAME']
              }, payload)
          PY
            gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/${path}" \
              --input /tmp/photo-payload.json >/dev/null
          done
